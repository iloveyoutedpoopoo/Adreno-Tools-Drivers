name: Build Turnip (Linux glibc)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Multiarch and Install Dependencies
        run: |
          sudo dpkg --add-architecture arm64
          sudo apt-get update
          sudo apt-get install -y \
            crossbuild-essential-arm64 \
            libx11-dev:arm64 libxext-dev:arm64 libxcb1-dev:arm64 \
            libx11-xcb-dev:arm64 libxshmfence-dev:arm64 \
            libxcb-dri2-0-dev:arm64 libxcb-dri3-dev:arm64 \
            libxcb-present-dev:arm64 libxcb-randr0-dev:arm64 \
            libxcb-sync-dev:arm64 libwayland-dev:arm64 libvulkan-dev:arm64 \
            libdrm-dev:arm64 zlib1g-dev:arm64 \
            ninja-build patchelf unzip flex bison git perl python3-pip \
            glslang-tools curl zip pkg-config pkg-config-aarch64-linux-gnu
          pip3 install --break-system-packages meson mako

      - name: Build Drivers
        run: |
          chmod +x build_turnip.sh
          export BUILD_VERSION="${{ github.run_number }}"
          ./build_turnip.sh

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Turnip-Drivers-glibc
          path: turnip_workdir/*.zip

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          files: turnip_workdir/*.zip
