name: Build Turnip Glibc

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Multiarch & Install Dependencies
        run: |
          # 關閉惱人的服務重啟提示
          export DEBIAN_FRONTEND=noninteractive
          
          # 1. 增加 ARM64 架構支援
          sudo dpkg --add-architecture arm64
          
          # 2. 修改軟體源設定以獲取 arm64 依賴包
          sudo sed -i 's/^deb /deb [arch=amd64,i386] /g' /etc/apt/sources.list
          echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports/ jammy main restricted universe multiverse" | sudo tee /etc/apt/sources.list.d/arm64.list
          echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports/ jammy-updates main restricted universe multiverse" | sudo tee -a /etc/apt/sources.list.d/arm64.list
          
          sudo apt-get update
          
          # 3. 安裝交叉編譯工具與基礎工具
          sudo apt-get install -y crossbuild-essential-arm64 ninja-build patchelf unzip flex bison git perl python3-pip glslang-tools curl zip pkg-config-aarch64-linux-gnu
          
          # 4. 安裝 ARM64 的圖形開發庫 (Glibc 環境專用)
          sudo apt-get install -y libdrm-dev:arm64 libx11-dev:arm64 libx11-xcb-dev:arm64 libxext-dev:arm64 libxcb-glx0-dev:arm64 libxcb-shm0-dev:arm64 libxcb-dri2-0-dev:arm64 libxcb-dri3-dev:arm64 libxcb-present-dev:arm64 libxshmfence-dev:arm64 libxrandr-dev:arm64 libwayland-dev:arm64 wayland-protocols
          
          # 5. 安裝 Meson 和 Mako (移除 --break-system-packages，因為 Ubuntu 22.04 不需要)
          pip3 install meson mako

      - name: Build Drivers
        run: |
          chmod +x build_turnip.sh
          export BUILD_VERSION="${{ github.run_number }}"
          ./build_turnip.sh

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Turnip-Glibc-Drivers
          path: turnip_workdir/*.zip

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          files: turnip_workdir/*.zip        with:
          name: Turnip-Glibc-Drivers
          path: turnip_workdir/*.zip

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          files: turnip_workdir/*.zip
