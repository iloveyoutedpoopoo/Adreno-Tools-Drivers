name: Build Turnip (Linux glibc)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Multiarch and APT sources
        run: |
          sudo dpkg --add-architecture arm64
          
          # 將原本的 amd64 來源加上架構標籤，避免 apt 去這裡找 arm64 發生 404
          sudo sed -i 's/deb http/deb [arch=amd64,i386] http/g' /etc/apt/sources.list
          sudo sed -i 's/deb mirror/deb [arch=amd64,i386] mirror/g' /etc/apt/sources.list
          
          # 新增專門給 arm64 使用的 ports.ubuntu.com 來源
          cat <<EOF | sudo tee /etc/apt/sources.list.d/arm64.list
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports/ jammy main restricted universe multiverse
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports/ jammy-updates main restricted universe multiverse
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports/ jammy-security main restricted universe multiverse
          EOF
          
          # 更新套件清單
          sudo apt-get update

      - name: Install Dependencies
        run: |
          # 在這裡移除了 pkg-config-aarch64-linux-gnu，只保留 pkg-config
          sudo apt-get install -y \
            crossbuild-essential-arm64 \
            libx11-dev:arm64 libxext-dev:arm64 libxcb1-dev:arm64 \
            libx11-xcb-dev:arm64 libxshmfence-dev:arm64 \
            libxcb-dri2-0-dev:arm64 libxcb-dri3-dev:arm64 \
            libxcb-present-dev:arm64 libxcb-randr0-dev:arm64 \
            libxcb-sync-dev:arm64 libwayland-dev:arm64 libvulkan-dev:arm64 \
            libdrm-dev:arm64 zlib1g-dev:arm64 \
            ninja-build patchelf unzip flex bison git perl python3-pip \
            glslang-tools curl zip pkg-config
          
          pip3 install meson mako || pip3 install --break-system-packages meson mako

      - name: Build Drivers
        run: |
          chmod +x build_turnip.sh
          export BUILD_VERSION="${{ github.run_number }}"
          ./build_turnip.sh

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Turnip-Drivers-glibc
          path: turnip_workdir/*.zip

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          files: turnip_workdir/*.zip          files: turnip_workdir/*.zip
